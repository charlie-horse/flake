# sops recipients for every encrypted file in this repo. How hosts decrypt
# (sops-nix, host keys, the CI and pre-switch checks): docs/auth.md,
# "sops-nix on the hosts"; every secret: docs/secrets.md.
# After changing a recipient list, re-encrypt the affected files with
# `sops updatekeys <file>` from the dev shell.
#
# Host keys are age recipients derived from each host's SSH ed25519 host
# public key: ssh-to-age < /etc/ssh/ssh_host_ed25519_key.pub. A reinstalled
# host gets a new key: update its anchor (and re-encrypt every file it
# reads) BEFORE its first switch, or admin's password is missing.
keys:
  # Admins: every rule includes both, so any file can be recovered.
  - &admin_yubikey age1yubikey1qwdgvy8jqgqjd2f380hf6d787x25eyhfwj5nxyv5gzhu6827medygv69f6q # age-plugin-yubikey (PIV slot)
  - &admin_backup age1dcz2gzz3u4uw09jvgp74zv33eqhvwgd7rl76kg9ehwy3g00thsms8vpl08 # offline file key, passphrase-encrypted
  # Hosts (ssh-to-age of the SSH ed25519 host key).
  - &c4130 age1jkfgs08xx6h07x0feqxxh2urnngpu5unt40hrs74t8pz37m3qags2mamet
  - &r440 age13g3xjkuy4fuvc7lusza526vl47ljyc5qx0452dq2z7hufhr45egq9wssep
  - &m2mini age1f25zd3jg5k8unh27rnmrlejmh8lxp2tep33rt5hp25d7k98773uqsdr0pn
  - &nether age1wr62sln8t5aje6hexsgp6uv5gsjz9e2tszuu3tzl80mdptlqwdxsglhp5d
  - &phoenix age1y5ftmq9j9070nzgedy2p34e9eqx42yg3tewjxt8d0alulnhrsq9s8xtum2
  # A host that is not listed here cannot decrypt and must not switch.
  # Enrolling a host: docs/hosts/famine.md.
  # Flux (in-cluster decryption of k8s secrets).
  - &flux age1ynj83hcd8zmscx4us80q6hqzxmr0d69hv3vr8extl5kvjqd92agqypgdux # flux-system/sops-age

creation_rules:
  # Host PKI from the export job: only the keys are encrypted; certs stay
  # plaintext. These rules must stay first, before any broader secrets/ rule.
  - path_regex: ^secrets/pki/c4130\.yaml$
    encrypted_regex: -key\.pem$
    key_groups:
      - age: [*admin_yubikey, *admin_backup, *c4130]
  - path_regex: ^secrets/pki/r440\.yaml$
    encrypted_regex: -key\.pem$
    key_groups:
      - age: [*admin_yubikey, *admin_backup, *r440]
  - path_regex: ^secrets/pki/m2mini\.yaml$
    encrypted_regex: -key\.pem$
    key_groups:
      - age: [*admin_yubikey, *admin_backup, *m2mini]
  # Service-account keypair, the same on every control plane.
  - path_regex: ^secrets/cluster-sa\.yaml$
    key_groups:
      - age: [*admin_yubikey, *admin_backup, *c4130, *r440, *m2mini]
  # Every host.
  - path_regex: ^secrets/common\.yaml$
    key_groups:
      - age:
          - *admin_yubikey
          - *admin_backup
          - *c4130
          - *r440
          - *m2mini
          - *nether
          - *phoenix
  # Admin-only material, never deployed to a host (e.g. the YubiKey PIV PUK).
  - path_regex: ^secrets/admin\.yaml$
    key_groups:
      - age: [*admin_yubikey, *admin_backup]
  # One host each (sops.defaultSopsFile = secrets/<lowercase hostname>.yaml).
  - path_regex: ^secrets/c4130\.yaml$
    key_groups:
      - age: [*admin_yubikey, *admin_backup, *c4130]
  - path_regex: ^secrets/r440\.yaml$
    key_groups:
      - age: [*admin_yubikey, *admin_backup, *r440]
  - path_regex: ^secrets/m2mini\.yaml$
    key_groups:
      - age: [*admin_yubikey, *admin_backup, *m2mini]
  - path_regex: ^secrets/famine\.yaml$
    key_groups:
      - age: [*admin_yubikey, *admin_backup]
  # Kubernetes secrets decrypted in-cluster by Flux (kustomize-controller's
  # sops decryption). Only the values under data/stringData are encrypted.
  # Layout enforced by k8s/render.nix: k8s/secrets/<namespace>/<name>.sops.yaml.
  # Sort keys before encrypting (docs/k8s/secrets.md).
  - path_regex: (^|/)k8s/secrets/[^/]+/[^/]+\.sops\.yaml$
    encrypted_regex: ^(data|stringData)$
    key_groups:
      - age: [*admin_yubikey, *admin_backup, *flux]
