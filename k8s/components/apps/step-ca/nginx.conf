# TLS sidecar of apps/step-ca: serves the cluster-ca cert (cert-manager) and
# proxies to step-ca on loopback, verifying step-ca's internal CA. The
# upper-case @…@ markers are filled in by deployment.nix.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  access_log off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  client_max_body_size 64k;

  server {
    listen @PROXY_PORT@ ssl;
    ssl_certificate /tls/tls.crt;
    ssl_certificate_key /tls/tls.key;
    ssl_protocols TLSv1.3;

    location / {
      proxy_pass https://127.0.0.1:@CA_PORT@;
      proxy_ssl_verify on;
      proxy_ssl_name localhost;
      proxy_ssl_trusted_certificate /internal-ca/ca.crt;
      proxy_set_header X-Forwarded-For $remote_addr;
    }
  }
}
