# TLS edge for *.@HANDLE_DOMAIN@ (apps/atproto-edge): the handle and did:web
# paths only, proxied to Tranquil PDS. The @…@ markers are filled in by
# default.nix.
worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  access_log off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
  }

  ssl_certificate /etc/nginx/tls/tls.crt;
  ssl_certificate_key /etc/nginx/tls/tls.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  # Any other SNI: handshake refused; any other Host: connection closed.
  server {
    listen @PORT@ ssl default_server;
    ssl_reject_handshake on;
    return 444;
  }

  server {
    listen @PORT@ ssl;
    server_name *.@HANDLE_DOMAIN@;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;

    location = /.well-known/atproto-did { proxy_pass http://@UPSTREAM@; }
    location = /.well-known/did.json { proxy_pass http://@UPSTREAM@; }
    location / { return 404; }
  }
}
