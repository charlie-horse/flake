# nginx sidecar of the cloudflared pods (apps/cloudflared): every public
# hostname arrives here from cloudflared and is proxied to its ClusterIP.
# The upper-case @…@ markers are filled in by files.nix.
worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  access_log off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # The visitor's IP as Cloudflare's edge saw it (a client cannot set it);
  # loopback if absent, i.e. not through Cloudflare.
  map $http_cf_connecting_ip $client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
  }
  map $http_x_forwarded_proto $forwarded_proto {
    ""      https;
    default $http_x_forwarded_proto;
  }
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
  }

  # Public hostname -> upstream ClusterIP:port.
  map $host $upstream {
    hostnames;
    default "";
@ROUTES@
  }

  # The Flux webhook host serves its /hook/ paths only.
  map "$host$uri" $path_allowed {
    default 1;
    ~^@HOOK_HOST_REGEX@/hook/ 1;
    ~^@HOOK_HOST_REGEX@/ "";
  }

  server {
    listen 127.0.0.1:@PROXY_PORT@;
    location / {
      if ($upstream = "") { return 404; }
      if ($path_allowed = "") { return 404; }
      proxy_pass http://$upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $client_ip;
      proxy_set_header X-Real-IP $client_ip;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header X-Forwarded-Host $host;
      # Long-lived: chat completions stream, websockets.
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering off;
      proxy_request_buffering off;
      client_max_body_size 256m;
    }
  }
}
