# Generated from k8s/components (catenix); do not edit, change the Nix
# source. Component: apps/authentik, kind: ConfigMap
apiVersion: v1
data:
  headlamp.yaml: |
    # Headlamp (k8s/components/apps/headlamp.nix): confidential client.
    # Headlamp forwards the ID token to the apiserver, which trusts this
    # provider's issuer (.../application/o/headlamp/) with audience `headlamp`
    # (cluster/definition.nix oidc.extraIssuers). authentik generates the client
    # secret; it goes into the hand-made Secret headlamp/headlamp-oidc
    # (k8s/README.md), never into git. k8s.neuros.is is filled in by
    # blueprints.nix.
    version: 1
    metadata:
      name: solaris - headlamp OIDC
      labels:
        blueprints.goauthentik.io/description: Headlamp OIDC client (k8s/components/apps/authentik)
    entries:
      # Also declared by kubernetes-oidc.yaml (same identifiers, so the same
      # group): declared here too so this file stands alone.
      - model: authentik_core.group
        id: cluster-admins
        identifiers:
          name: cluster-admins
        attrs:
          name: cluster-admins

      - model: authentik_providers_oauth2.oauth2provider
        id: provider
        identifiers:
          name: headlamp
        attrs:
          name: headlamp
          client_type: confidential
          client_id: headlamp
          # Only listed grants are allowed (empty = none).
          grant_types:
            - authorization_code
            - refresh_token
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          issuer_mode: per_provider
          sub_mode: hashed_user_id
          include_claims_in_id_token: true
          access_token_validity: minutes=15
          refresh_token_validity: days=1
          redirect_uris:
            - matching_mode: strict
              url: https://k8s.neuros.is/oidc-callback
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-offline_access]]

      - model: authentik_core.application
        id: application
        identifiers:
          slug: headlamp
        attrs:
          name: Headlamp (solaris)
          provider: !KeyOf provider
          meta_launch_url: https://k8s.neuros.is/
          policy_engine_mode: any

      # Only members of cluster-admins may log in to Headlamp.
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf application
          group: !KeyOf cluster-admins
        attrs:
          order: 0
  kubernetes-oidc.yaml: |
    # kubectl / kube-apiserver OIDC: public client `kubernetes` (kubelogin, PKCE;
    # kubelogin's default callbacks are localhost:8000 and :18000). The
    # apiserver trusts this provider's issuer (cluster/definition.nix `oidc`).
    version: 1
    metadata:
      name: solaris - kubernetes OIDC
      labels:
        blueprints.goauthentik.io/description: kube-apiserver OIDC client (k8s/components/apps/authentik)
    entries:
      - model: authentik_core.group
        id: cluster-admins
        identifiers:
          name: cluster-admins
        attrs:
          name: cluster-admins

      - model: authentik_providers_oauth2.oauth2provider
        id: provider
        identifiers:
          name: kubernetes
        attrs:
          name: kubernetes
          client_type: public
          client_id: kubernetes
          # authentik >= 2026.x allows only the listed grants (empty = none):
          # the browser login (code + PKCE) and kubelogin's silent renewals.
          grant_types:
            - authorization_code
            - refresh_token
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          issuer_mode: per_provider
          sub_mode: hashed_user_id
          include_claims_in_id_token: true
          access_token_validity: minutes=15
          refresh_token_validity: days=7
          redirect_uris:
            - matching_mode: strict
              url: http://localhost:8000
            - matching_mode: strict
              url: http://localhost:18000
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-offline_access]]

      - model: authentik_core.application
        id: application
        identifiers:
          slug: kubernetes
        attrs:
          name: Kubernetes (solaris)
          provider: !KeyOf provider
          policy_engine_mode: any

      # Only members of cluster-admins may log in to the cluster.
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf application
          group: !KeyOf cluster-admins
        attrs:
          order: 0
  open-webui.yaml: |
    # Open WebUI (k8s/components/apps/open-webui.nix): confidential client for
    # members of the group `local-ai`. authentik generates the client secret on
    # creation; it goes into the hand-made Secret open-webui/open-webui-secrets,
    # never into git. chat.neuros.is is filled in by blueprints.nix.
    version: 1
    metadata:
      name: solaris - open-webui OIDC
      labels:
        blueprints.goauthentik.io/description: Open WebUI OIDC client (k8s/components/apps/authentik)
    entries:
      - model: authentik_core.group
        id: local-ai
        identifiers:
          name: local-ai
        attrs:
          name: local-ai

      - model: authentik_providers_oauth2.oauth2provider
        id: provider
        identifiers:
          name: open-webui
        attrs:
          name: open-webui
          client_type: confidential
          client_id: open-webui
          grant_types:
            - authorization_code
            - refresh_token
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          issuer_mode: per_provider
          sub_mode: hashed_user_id
          include_claims_in_id_token: true
          access_token_validity: minutes=15
          refresh_token_validity: days=30
          redirect_uris:
            - matching_mode: strict
              url: https://chat.neuros.is/oauth/oidc/callback
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]

      - model: authentik_core.application
        id: application
        identifiers:
          slug: open-webui
        attrs:
          name: Open WebUI
          provider: !KeyOf provider
          meta_launch_url: https://chat.neuros.is/
          policy_engine_mode: any

      # Only members of local-ai may log in to Open WebUI.
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf application
          group: !KeyOf local-ai
        attrs:
          order: 0
kind: ConfigMap
metadata:
  name: authentik-blueprints
  namespace: authentik
