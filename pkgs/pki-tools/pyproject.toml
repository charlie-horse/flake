[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "pki-tools"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["cryptography", "pyyaml"]

[project.scripts]
pki-export = "pki.cli_export:main"
pki-diff = "pki.cli_diff:main"

[tool.setuptools]
packages = ["pki"]

[tool.pytest.ini_options]
testpaths = ["tests"]
