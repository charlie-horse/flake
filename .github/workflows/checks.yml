# Checks: the repository's gate. Runs on every pull request and push to
# main, whatever changed. It only checks; it never builds a NixOS toplevel
# (the c4130 closure alone is CUDA + torch + vLLM, far beyond a hosted
# runner) and never writes.
#
#   flake-check    `nix flake check`, the single gate (parts/checks.nix).
#                  On main it also uploads the render it built (artifact
#                  `manifests`), which render.yml publishes.
#
# See docs/ci.md.
name: checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  # PRs: newest push wins. main: every push is checked.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ------------------------------------------------------------------------
  flake-check:
    name: nix flake check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # r440's binary cache, if NIX_CACHE_NETRC is available (not on fork
      # PRs): .github/actions/nix-cache, docs/ci.md.
      - id: nix-cache
        uses: ./.github/actions/nix-cache
        with:
          netrc: ${{ secrets.NIX_CACHE_NETRC }}
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.6/install
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: ${{ steps.nix-cache.outputs.nix-conf }}
      # Evaluates every output and builds the `checks` (parts/checks.nix),
      # the k8s render included.
      - run: nix flake check --keep-going -L

      # The same derivation as the `k8s-render` check: no rebuild.
      - name: Collect the render
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          nix build --out-link result .#k8s.manifests
          mkdir -p manifests
          cp -r --no-preserve=mode result/. manifests/
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manifests
          path: manifests
          if-no-files-found: error
          retention-days: 7
