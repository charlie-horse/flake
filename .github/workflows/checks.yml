# Checks: the repository's gate. Runs on every pull request to main,
# whatever changed (pushes to main run render.yml instead). It only checks:
# it must never build a NixOS toplevel (too large for a hosted runner) and
# never writes.
#
#   flake-check    `nix flake check`, the single gate (parts/checks.nix),
#                  the k8s render included.
#
# See docs/ci.md.
name: checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  # Newest push to a PR wins.
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------------
  flake-check:
    name: nix flake check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The flake's binary cache, if NIX_CACHE_NETRC is available (not on
      # fork PRs): .github/actions/nix-cache, docs/ci.md.
      - id: nix-cache
        uses: ./.github/actions/nix-cache
        with:
          netrc: ${{ secrets.NIX_CACHE_NETRC }}
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.6/install
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: ${{ steps.nix-cache.outputs.nix-conf }}
      # Evaluates every output and builds the `checks` (parts/checks.nix),
      # the k8s render included.
      - run: nix flake check --keep-going -L

