name: render

on:
  push:
    branches: [main]
    paths:
      - "k8s/**"
      - ".github/workflows/render.yml"
  pull_request:
    branches: [main]
    paths:
      - "k8s/**"
      - ".github/workflows/render.yml"
  workflow_dispatch:
    inputs:
      publish-cached-anyways:
        required: true
        default: false
        type: boolean
        description: Should existing manifests be redeployed?

permissions:
  contents: read

concurrency:
  group: k8s-${{ github.ref }}
  # PRs: newest push wins. main: queue, so render commits never race.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Evaluation must never build: an IFD would be a build (CUDA/vLLM included).
  # The host evals pass this; the k8s render needs IFD and does not.
  NO_IFD: --option allow-import-from-derivation false

jobs:
  check:
    name: nix flake check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    if: github.event_name != 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31.11.2
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: DeterminateSystems/magic-nix-cache-action@main
      # Evaluates every output (all NixOS hosts, ISOs, packages). Not
      # `--no-build`: it can't realise import-from-derivation (the catenix
      # chart renders, `helm template`, small), so evaluation fails with
      # "helm-template-*.json.drv is not valid". The flake has no `checks`
      # outputs, so nothing else gets built; the NixOS hosts have no IFD.
      - run: nix flake check --keep-going -L
  # ------------------------------------------------------------------------
  render:
    name: Render k8s manifests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: ${{ inputs.publish-cached-anyways == false }}
    outputs:
      cached: ${{ steps.cache.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Cache
        id: cache
        uses: actions/cache@v5.1.0
        with:
          # A list of files, directories, and wildcard patterns to cache and restore
          path: manifests
          # An explicit key for restoring and saving the cache
          key: manifest-build-${{ hashFiles(
            'k8s/**',
            '.github/workflows/render.yml') }}
          enableCrossOsArchive: true
    
      - uses: cachix/install-nix-action@v31.11.2
        id: install-nix
        if: steps.cache.outputs.cache-hit == 'false'
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: nix build .#k8s-manifests
        id: build
        if: steps.install-nix.outcome == 'success'
        run: nix build -L --out-link manifests .#k8s-manifests

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: manifests
          path: manifests
          if-no-files-found: error
          retention-days: 7

  # ------------------------------------------------------------------------
  publish:
    name: Publish manifests
    if: >-
      always()
      && (needs.render.result == 'skipped'
          && inputs.publish-cached-anyways)
      || (needs.render.result == 'success'
          && needs.render.outputs.cached == false
          && (github.event_name == 'workflow_dispatch'
              || (github.ref == 'refs/heads/main'
                  && github.event_name == 'push')))
    needs: [render]
    permissions:
      packages: write
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Setup Flux CLI
        uses: fluxcd/flux2/action@v2.9.5

      - name: Setup Cosign
        uses: sigstore/cosign-installer@v4.1.3

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - uses: actions/download-artifact@v8.0.2
        with:
          name: manifests
          path: manifests

      - name: Push artifact
        run: |
          url="oci://ghcr.io/$GITHUB_REPOSITORY/manifests:${GITHUB_SHA::12}"

          out=$(flux push artifact "$url" --path manifests -o json \
            --source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --revision="main@sha1:$GITHUB_SHA")
          echo "$out"

          flux tag artifact "$url" --tag main

          ref=$(echo $out | jq -r '.repository + "@" + .digest')
          cosign sign --yes "$ref"
