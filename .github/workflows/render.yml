# Render ./k8s (catenix) and ship it to the cluster.
#
#   render   (every PR and push touching the render's inputs) builds
#            .#k8s.manifests from THIS commit, fails on key material, checks
#            that images are multi-arch (advisory) and uploads the tree.
#   publish  (main only) pushes the tree to GHCR as an OCI artifact
#            (ghcr.io/<repo>/manifests, tags <sha12> and main), signs it with
#            cosign (keyless, this workflow's GitHub OIDC identity) and pings
#            Flux's webhook. Flux applies only artifacts signed by this
#            workflow on main (k8s/components/flux/sync.nix).
#
# Every push to main publishes (Flux does nothing when the digest is
# unchanged). The cache only skips the nix build when the render inputs
# equal an earlier render's; it never decides whether to publish, so a
# revert to an earlier state is deployed like any other change. Dispatching
# the workflow on main republishes the current render. See docs/ci.md.
name: render

on:
  push:
    branches: [main]
    paths:
      - "k8s/**"
      - "cluster/**"
      - "parts/**"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/render.yml"
  pull_request:
    branches: [main]
    paths:
      - "k8s/**"
      - "cluster/**"
      - "parts/**"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/render.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-${{ github.ref }}
  # PRs: newest push wins. main: queue, so artifacts are published in order.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  render:
    name: Render k8s manifests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      cached: ${{ steps.cache.outputs.cache-hit }}
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Everything the render reads (see paths above).
      - name: Cache key
        id: key
        run: |
          echo "key=k8s-manifests-${{ hashFiles('k8s/**', 'cluster/**', 'parts/**', 'flake.nix', 'flake.lock', '.github/workflows/render.yml') }}" \
            >> "$GITHUB_OUTPUT"

      - name: Restore an earlier render of the same inputs
        id: cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: manifests
          key: ${{ steps.key.outputs.key }}

      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: nix build .#k8s.manifests
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          nix build -L --out-link result .#k8s.manifests
          mkdir -p manifests
          cp -r --no-preserve=mode result/. manifests/

      - name: No key material in the render
        run: |
          if grep -rlE -- '-----BEGIN ([A-Z]+ )?PRIVATE KEY-----|client-key-data[:]' manifests; then
            echo "::error::rendered manifests contain key material"
            exit 1
          fi
          {
            echo "### k8s render"
            echo
            echo '```'
            (cd manifests && find . -name '*.yaml' | sort)
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Images are multi-arch (amd64 + arm64)
        # Network (registries); advisory.
        if: steps.cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          nix build --out-link check-images .#k8s.checkImages
          ./check-images/bin/k8s-check-images

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manifests
          path: manifests
          if-no-files-found: error
          retention-days: 7

  # ------------------------------------------------------------------------
  publish:
    name: Publish manifests
    needs: [render]
    if: >-
      github.ref == 'refs/heads/main'
      && needs.render.result == 'success'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      packages: write
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: fluxcd/flux2/action@dd233c4fadef306a62b7893204f8e3817fecc2b2 # v2.9.5
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: manifests
          path: manifests

      - name: Login to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Push and sign the artifact
        run: |
          set -euo pipefail
          url="oci://ghcr.io/$GITHUB_REPOSITORY/manifests:${GITHUB_SHA::12}"
          out=$(flux push artifact "$url" --path manifests -o json \
            --source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --revision="main@sha1:$GITHUB_SHA")
          echo "$out"
          flux tag artifact "$url" --tag main
          ref=$(echo "$out" | jq -r '.repository + "@" + .digest')
          cosign sign --yes "$ref"
          echo "published \`$ref\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Flux
        env:
          TOKEN: ${{ secrets.FLUX_WEBHOOK_TOKEN }}
          URL: ${{ secrets.FLUX_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          body="{\"revision\":\"main@sha1:$GITHUB_SHA\"}"
          sig=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$TOKEN" -r | cut -d' ' -f1)
          curl -fsS -X POST "$URL" \
            -H "Content-Type: application/json" \
            -H "X-Signature: sha256=$sig" \
            --data "$body"

      # Lets a later run with the same inputs skip the nix build. Saved after
      # a successful publish, from main (so PRs can restore it too).
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        if: needs.render.outputs.cached != 'true'
        with:
          path: manifests
          key: ${{ needs.render.outputs.key }}
