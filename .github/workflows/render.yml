# Ship the k8s render (./k8s, catenix) to the cluster.
#
#   render   takes the render that checks.yml built (its `manifests`
#            artifact) when a checks run on main succeeds, or builds
#            .#k8s.manifests when dispatched.
#   publish  pushes the tree as an OCI artifact to GHCR
#            (ghcr.io/<repo>/manifests) and ATCR
#            (cr.neuros.is/<ATCR_USERNAME>/flake/manifests), tags <sha12> and
#            main, signs each with cosign (keyless, this workflow's GitHub
#            OIDC identity) and pings Flux's webhook. Flux applies only artifacts signed by this
#            workflow on main (k8s/components/flux/sync.nix).
#
# Pull requests are checked by checks.yml (`nix flake check` builds the
# render). Dispatching on main republishes. Details: docs/ci.md#renderyml.
name: render

on:
  workflow_run:
    workflows: [checks]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render
  # Queue, so artifacts are published in order.
  cancel-in-progress: false

env:
  # The commit rendered: the checks run's, or (dispatch) this one.
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  render:
    name: Render k8s manifests
    # Only successful checks of pushes to (or dispatches on) main in this
    # repository: fork PRs can also be on a branch named main.
    if: >-
      github.ref == 'refs/heads/main'
      && (github.event_name == 'workflow_dispatch'
          || (github.event.workflow_run.conclusion == 'success'
              && github.event.workflow_run.head_repository.full_name == github.repository
              && contains(fromJSON('["push", "workflow_dispatch"]'), github.event.workflow_run.event)))
    permissions:
      contents: read
      actions: read # the checks run's artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false

      - name: Take the render from the checks run
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: manifests
          path: manifests
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # r440's binary cache, if NIX_CACHE_NETRC is available:
      # .github/actions/nix-cache, docs/ci.md.
      - id: nix-cache
        if: github.event_name == 'workflow_dispatch'
        uses: ./.github/actions/nix-cache
        with:
          netrc: ${{ secrets.NIX_CACHE_NETRC }}
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        if: github.event_name == 'workflow_dispatch'
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.6/install
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: ${{ steps.nix-cache.outputs.nix-conf }}

      - name: nix build .#k8s.manifests
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          nix build -L --out-link result .#k8s.manifests
          mkdir -p manifests
          cp -r --no-preserve=mode result/. manifests/

      - name: List the render
        run: |
          {
            echo "### k8s render"
            echo
            echo '```'
            (cd manifests && find . -name '*.yaml' | sort)
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manifests
          path: manifests
          if-no-files-found: error
          retention-days: 7

  # ------------------------------------------------------------------------
  publish:
    name: Publish manifests
    needs: [render]
    if: needs.render.result == 'success'
    permissions:
      contents: read
      packages: write
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: fluxcd/flux2/action@dd233c4fadef306a62b7893204f8e3817fecc2b2 # v2.9.5
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: manifests
          path: manifests

      - name: Login to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Push and sign the artifact
        id: ghcr
        run: |
          set -euo pipefail
          url="oci://ghcr.io/$GITHUB_REPOSITORY/manifests:${SHA::12}"
          out=$(flux push artifact "$url" --path manifests -o json \
            --source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --revision="main@sha1:$SHA")
          echo "$out"
          flux tag artifact "$url" --tag main
          ref=$(echo "$out" | jq -r '.repository + "@" + .digest')
          cosign sign --yes "$ref"
          echo "published \`$ref\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Push and sign the artifact on ATCR
        env:
          ATCR_USERNAME: ${{ secrets.ATCR_USERNAME }}
          ATCR_APP_PASSWORD: ${{ secrets.ATCR_APP_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$ATCR_APP_PASSWORD" | docker login cr.neuros.is -u "$ATCR_USERNAME" --password-stdin
          url="oci://cr.neuros.is/$ATCR_USERNAME/flake/manifests:${SHA::12}"
          out=$(flux push artifact "$url" --path manifests -o json \
            --source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --revision="main@sha1:$SHA")
          echo "$out"
          flux tag artifact "$url" --tag main
          ref=$(echo "$out" | jq -r '.repository + "@" + .digest')
          cosign sign --yes "$ref"
          echo "published \`$ref\`" >> "$GITHUB_STEP_SUMMARY"

      # Flux reads one of the two registries (cluster.flakeRegistry).
      - name: Notify Flux
        if: ${{ !cancelled() && steps.ghcr.outcome == 'success' }}
        env:
          TOKEN: ${{ secrets.FLUX_WEBHOOK_TOKEN }}
          URL: ${{ secrets.FLUX_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          body="{\"revision\":\"main@sha1:$SHA\"}"
          sig=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$TOKEN" -r | cut -d' ' -f1)
          curl -fsS -X POST "$URL" \
            -H "Content-Type: application/json" \
            -H "X-Signature: sha256=$sig" \
            --data "$body"
