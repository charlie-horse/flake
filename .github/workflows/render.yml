# Ship the k8s render (./k8s, catenix) to the cluster.
#
#   render   builds .#k8s.manifests on every push to main (and when
#            dispatched on main).
#   publish  pushes the tree to GHCR as an OCI artifact
#            (ghcr.io/<repo>/manifests, tags <sha12> and main), signs it with
#            cosign (keyless, this workflow's GitHub OIDC identity) and pings
#            Flux's webhook. Flux applies only artifacts signed by this
#            workflow on main (k8s/components/flux/sync.nix).
#
# Pull requests are checked by checks.yml (`nix flake check` builds the
# render); main is not re-checked. Dispatching on main republishes.
# Details: docs/ci.md#renderyml.
name: render

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render
  # Queue, so artifacts are published in order.
  cancel-in-progress: false

env:
  SHA: ${{ github.sha }}

jobs:
  render:
    name: Render k8s manifests
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false

      # The flake's binary cache, if NIX_CACHE_NETRC is available:
      # .github/actions/nix-cache, docs/ci.md.
      - id: nix-cache
        uses: ./.github/actions/nix-cache
        with:
          netrc: ${{ secrets.NIX_CACHE_NETRC }}
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.6/install
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: ${{ steps.nix-cache.outputs.nix-conf }}

      - name: nix build .#k8s.manifests
        run: |
          set -euo pipefail
          nix build -L --out-link result .#k8s.manifests
          mkdir -p manifests
          cp -r --no-preserve=mode result/. manifests/

      - name: List the render
        run: |
          {
            echo "### k8s render"
            echo
            echo '```'
            (cd manifests && find . -name '*.yaml' | sort)
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manifests
          path: manifests
          if-no-files-found: error
          retention-days: 7

  # ------------------------------------------------------------------------
  publish:
    name: Publish manifests
    needs: [render]
    if: needs.render.result == 'success'
    permissions:
      contents: read
      packages: write
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: fluxcd/flux2/action@dd233c4fadef306a62b7893204f8e3817fecc2b2 # v2.9.5
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: manifests
          path: manifests

      - name: Login to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Push and sign the artifact
        run: |
          set -euo pipefail
          url="oci://ghcr.io/$GITHUB_REPOSITORY/manifests:${SHA::12}"
          out=$(flux push artifact "$url" --path manifests -o json \
            --source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --revision="main@sha1:$SHA")
          echo "$out"
          flux tag artifact "$url" --tag main
          ref=$(echo "$out" | jq -r '.repository + "@" + .digest')
          cosign sign --yes "$ref"
          echo "published \`$ref\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Flux
        env:
          TOKEN: ${{ secrets.FLUX_WEBHOOK_TOKEN }}
          URL: ${{ secrets.FLUX_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          body="{\"revision\":\"main@sha1:$SHA\"}"
          sig=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$TOKEN" -r | cut -d' ' -f1)
          curl -fsS -X POST "$URL" \
            -H "Content-Type: application/json" \
            -H "X-Signature: sha256=$sig" \
            --data "$body"
