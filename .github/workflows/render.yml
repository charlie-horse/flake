name: render

on:
  push:
    branches: [main]
    paths:
      - "hosts/c4130/**"
      - "hosts/r440/**"
      - "hosts/m2mini/**"
      - "modules/cluster/**"
      - "cluster/**"
      - "k8s/**"
      - "pkgs/**"
      - "lib/**"
      - "parts/**"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/k8s.yml"
  pull_request:
    branches: [main]
    paths:
      - "hosts/c4130/**"
      - "hosts/r440/**"
      - "hosts/m2mini/**"
      - "modules/cluster/**"
      - "cluster/**"
      - "k8s/**"
      - "pkgs/**"
      - "lib/**"
      - "parts/**"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/k8s.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: k8s-${{ github.ref }}
  # PRs: newest push wins. main: queue, so render commits never race.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Evaluation must never build: an IFD would be a build (CUDA/vLLM included).
  # The host evals pass this; the k8s render needs IFD and does not.
  NO_IFD: --option allow-import-from-derivation false

jobs:
  check:
    name: nix flake check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31.11.2
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: DeterminateSystems/magic-nix-cache-action@main
      # Evaluates every output (all NixOS hosts, ISOs, packages). Not
      # `--no-build`: it can't realise import-from-derivation (the catenix
      # chart renders, `helm template`, small), so evaluation fails with
      # "helm-template-*.json.drv is not valid". The flake has no `checks`
      # outputs, so nothing else gets built; the NixOS hosts have no IFD.
      - run: nix flake check --keep-going -L
  # ------------------------------------------------------------------------
  render:
    name: Render k8s manifests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31.11.2
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: nix build .#k8s-manifests
        run: nix build -L --out-link result-k8s .#k8s-manifests

      - name: Check for private keys
        run: |
          if grep -rlE -- '-----BEGIN ([A-Z]+ )?PRIVATE KEY-----|client-key-data[:]' result-k8s/;
          then
            echo "::error::rendered manifests contain key material"
            exit 1
          fi

      - name: Compare with k8s/rendered
        id: diff
        run: |
          set -euo pipefail
          rm -rf k8s/rendered/**
          cp -r --no-preserve=mode result-k8s/. k8s/rendered/
          git add -N k8s/rendered
          
          if git diff --quiet -- k8s/rendered; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "k8s/rendered is up to date" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "### k8s/rendered changes"
              echo
              echo '```'
              git diff --stat -- k8s/rendered
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
              echo "::notice::k8s/rendered differs; it is re-rendered and" \
                "committed on merge to main."
            fi
          fi

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: k8s-rendered
          path: k8s/rendered/
          if-no-files-found: error
          retention-days: 7

  # ------------------------------------------------------------------------
  publish:
    name: Publish k8s/rendered
    if: >-
      needs.render.outputs.changed == 'true'
      && github.ref == 'refs/heads/main'
      && github.event_name == 'push'
    needs: [check, render]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Setup Flux CLI
        uses: fluxcd/flux2/action@main

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            flux oci login ghcr.io --username flux --password-stdin

      - uses: actions/download-artifact@v8.0.2
        with:
          name: k8s-rendered
          path: k8s/rendered

      - name: Push artifact
        run: |
          flux push artifact \
            oci://ghcr.io/${{ github.repository }}/manifests:$(git rev-parse --short HEAD) \
            --path k8s/rendered
