# Flake input updates, pushed straight to main (hands-free).
#
# `nix flake update` (every input, vllm-fork included), then the gate a
# human change gets: `nix flake check` (host evals and the k8s render
# included). Only if it passes is flake.lock committed and pushed to main;
# on failure nothing is pushed and the failed run is the signal.
#
# GITHUB_TOKEN pushes trigger no workflows, so the job then dispatches
# checks.yml and render.yml on main. A vllm-fork bump is flagged in the
# commit message and run summary. Needs main to allow pushes by
# github-actions[bot]. Details: docs/ci.md#updateyml
name: update

on:
  schedule:
    - cron: "0 4 * * Mon,Fri" # 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write # push to main
  actions: write # dispatch checks.yml and render.yml after the push

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    name: Update flake inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      # r440's binary cache: .github/actions/nix-cache, docs/ci.md.
      - id: nix-cache
        uses: ./.github/actions/nix-cache
        with:
          netrc: ${{ secrets.NIX_CACHE_NETRC }}
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.6/install
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: ${{ steps.nix-cache.outputs.nix-conf }}

      - name: nix flake update
        id: update
        run: |
          set -euo pipefail
          cp flake.lock "$RUNNER_TEMP/flake.lock.old"
          nix flake update
          if git diff --quiet -- flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No input changed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: nix flake check
        if: steps.update.outputs.changed == 'true'
        run: nix flake check --keep-going -L

      - name: Describe the changes
        if: steps.update.outputs.changed == 'true'
        id: describe
        run: |
          set -euo pipefail
          rows=$(jq -r --slurpfile old "$RUNNER_TEMP/flake.lock.old" '
            ($old[0].nodes) as $o
            | .nodes | to_entries[]
            | select(.key != "root")
            | {k: .key,
               new: (.value.locked.rev // .value.locked.narHash // ""),
               old: (if $o[.key] == null then "(new)"
                     else ($o[.key].locked.rev // $o[.key].locked.narHash // "") end)}
            | select(.new != .old)
            | "\(.k) \(.old[0:12]) -> \(.new[0:12])"' flake.lock)
          vllm=false
          if echo "$rows" | grep -q '^vllm-fork '; then vllm=true; fi
          {
            echo "flake.lock: update inputs ($(date -u +%Y-%m-%d))"
            echo
            if [ "$vllm" = true ]; then
              echo "WARNING: vllm-fork moved. This changes c4130's production vLLM on its"
              echo "next switch: build it on r440 and GC c4130 first."
              echo
            fi
            echo "$rows"
            echo
            echo "Passed before push: nix flake check."
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > "$RUNNER_TEMP/msg.txt"
          {
            echo '```'
            cat "$RUNNER_TEMP/msg.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$vllm" = true ]; then
            echo "::warning::vllm-fork moved; c4130's next switch changes production vLLM"
          fi

      # Fast-forward only. If main moved during the run and the new commits
      # touch flake.nix or flake.lock, give up (the next run retries);
      # otherwise rebase the lock commit onto the new main.
      - name: Commit and push to main
        if: steps.update.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898733+github-actions[bot]@users.noreply.github.com"
          base=$(git rev-parse HEAD)
          git commit -q -a -F "$RUNNER_TEMP/msg.txt"
          for _ in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Pushed $(git rev-parse --short HEAD) to main" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            git fetch -q origin main
            if ! git diff --quiet "$base" FETCH_HEAD -- flake.nix flake.lock; then
              echo "::error::main changed flake.nix/flake.lock during this run; not pushing (next run retries)"
              exit 1
            fi
            git rebase -q FETCH_HEAD
            base=$(git rev-parse FETCH_HEAD)
          done
          echo "::error::push to main failed 3 times"
          exit 1

      # GITHUB_TOKEN pushes trigger no workflows; dispatch is the exception.
      - name: Run checks and render on main
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run checks.yml --ref main
          gh workflow run render.yml --ref main
