name: Update
permissions:
  contents: write
on:
  schedule:
    - cron: 0 4 * * Mon,Fri # 00:00 EST
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
      
      - name: Update flake
        run: nix flake update

      - name: Check flake
        run: nix flake check

      # The k8s render is not a per-system output, so flake check does not
      # build it (parts/k8s.nix); this push runs no other workflow
      # (GITHUB_TOKEN), so check here that the bumped inputs still render.
      - name: Render k8s
        run: nix build -L --no-link .#k8s.manifests

      - name: Commit & push
        run: |
          git config --global user.name 'Github Action: Update'
          git config --global user.email '<>'
          git commit -am "Actions: Update flake"
          git push
