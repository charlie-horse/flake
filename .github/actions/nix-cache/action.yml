# r440's Nix binary cache (https://cache.neuros.is, basic auth) for a job,
# as nix.conf lines for cachix/install-nix-action's `extra_nix_config`:
#
#   - id: nix-cache
#     uses: ./.github/actions/nix-cache
#     with:
#       netrc: ${{ secrets.NIX_CACHE_NETRC }}
#   - uses: cachix/install-nix-action@<sha>
#     with:
#       extra_nix_config: ${{ steps.nix-cache.outputs.nix-conf }}
#
# Without the secret (pull requests from forks, Dependabot) the output is
# empty and the job uses cache.nixos.org only, exactly as before. With it,
# the netrc goes to $RUNNER_TEMP (mode 600; the nix-daemon reads it as
# root) and is never printed. Read-only: harmonia serves r440's store, CI
# cannot push to it.
#
# The URL and key mirror cluster/definition.nix `binaryCache` (host,
# publicKey); change both together. See docs/ci.md.
name: nix-cache
description: nix.conf lines for r440's binary cache, if the netrc secret is set
inputs:
  netrc:
    description: >-
      netrc for the cache, one line:
      machine cache.neuros.is login <user> password <password>
    required: false
    default: ""
outputs:
  nix-conf:
    description: nix.conf lines (empty without the secret)
    value: ${{ steps.conf.outputs.nix-conf }}
runs:
  using: composite
  steps:
    - id: conf
      shell: bash
      env:
        NETRC: ${{ inputs.netrc }}
        CACHE_URL: https://cache.neuros.is
        CACHE_KEY: r440-cache-1:8fh7/X6s7t2jRyhLZZRc6boWitD/RSJt2B9DxmF5Gj8=
      run: |
        set -euo pipefail
        if [ -z "${NETRC:-}" ]; then
          echo "NIX_CACHE_NETRC is not available here: cache.nixos.org only."
          echo "nix-conf=" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        netrc="$RUNNER_TEMP/nix-cache.netrc"
        (
          umask 077
          printf '%s\n' "$NETRC" > "$netrc"
        )
        {
          echo 'nix-conf<<NIX_CACHE_CONF_EOF'
          # After cache.nixos.org (40): only what it lacks comes from r440.
          echo "extra-substituters = $CACHE_URL?priority=50"
          echo "extra-trusted-public-keys = $CACHE_KEY"
          echo "netrc-file = $netrc"
          # A down cache costs seconds and is skipped for 60 s.
          echo "connect-timeout = 5"
          echo "fallback = true"
          echo 'NIX_CACHE_CONF_EOF'
        } >> "$GITHUB_OUTPUT"
        echo "r440's cache enabled ($CACHE_URL, read-only)."
