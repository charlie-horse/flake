# The flake's Nix binary cache (basic auth) for a job, as nix.conf lines
# for cachix/install-nix-action's `extra_nix_config`:
#
#   - id: nix-cache
#     uses: ./.github/actions/nix-cache
#     with:
#       netrc: ${{ secrets.NIX_CACHE_NETRC }}
#   - uses: cachix/install-nix-action@<sha>
#     with:
#       extra_nix_config: ${{ steps.nix-cache.outputs.nix-conf }}
#
# Without the secret (fork PRs, Dependabot) the output is empty: cache.nixos.org
# only. The netrc goes to $RUNNER_TEMP (mode 600), never printed. Read-only.
# CACHE_URL and CACHE_KEY must match cluster/definition.nix `binaryCache`.
# Details: docs/build-cache.md#github-actions.
name: nix-cache
description: nix.conf lines for the flake's binary cache, if the netrc secret is set
inputs:
  netrc:
    description: >-
      netrc for the cache, one line:
      machine cache.neuros.is login <user> password <password>
    required: false
    default: ""
outputs:
  nix-conf:
    description: nix.conf lines (empty without the secret)
    value: ${{ steps.conf.outputs.nix-conf }}
runs:
  using: composite
  steps:
    - id: conf
      shell: bash
      env:
        NETRC: ${{ inputs.netrc }}
        CACHE_URL: https://cache.neuros.is
        CACHE_KEY: r440-cache-1:8fh7/X6s7t2jRyhLZZRc6boWitD/RSJt2B9DxmF5Gj8=
      run: |
        set -euo pipefail
        if [ -z "${NETRC:-}" ]; then
          echo "NIX_CACHE_NETRC is not available here: cache.nixos.org only."
          echo "nix-conf=" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        netrc="$RUNNER_TEMP/nix-cache.netrc"
        (
          umask 077
          printf '%s\n' "$NETRC" > "$netrc"
        )
        {
          echo 'nix-conf<<NIX_CACHE_CONF_EOF'
          # After cache.nixos.org: only what it lacks comes from this cache.
          echo "extra-substituters = $CACHE_URL?priority=50"
          echo "extra-trusted-public-keys = $CACHE_KEY"
          echo "netrc-file = $netrc"
          # A down cache costs seconds and is skipped.
          echo "connect-timeout = 5"
          echo "fallback = true"
          echo 'NIX_CACHE_CONF_EOF'
        } >> "$GITHUB_OUTPUT"
        echo "Binary cache enabled ($CACHE_URL, read-only)."
